const RELY_ON_MODEL = true; // pon false si algún día se quiere reactivar las respuestas locales

// -------- Zona horaria de visualización (IANA) --------
// Ejemplos: "America/Bogota" (UTC-5 fijo), "America/Chicago" (DST), "America/Lima"
const DISPLAY_TIMEZONE = "America/Bogota";

// Comprueba si la TZ es válida en este runtime
function isValidTZ(tz){
  try { new Intl.DateTimeFormat("en-US", { timeZone: tz }).format(new Date()); return true; }
  catch { return false; }
}

// Devuelve una TZ válida (si la dada no lo es, usa la del navegador)
function resolvedTZ(){
  return isValidTZ(DISPLAY_TIMEZONE)
    ? DISPLAY_TIMEZONE
    : Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
}


function formatLocal(d) {
  if (!(d instanceof Date) || isNaN(d)) return "";
  const tz = resolvedTZ();
  try {
    const opts = { timeZone: tz, year:"numeric", month:"2-digit", day:"2-digit",
                   hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false };
    return new Intl.DateTimeFormat("es-ES", opts).format(d).replace(",", "");
  } catch {
    // Fallback súper seguro
    return d.toLocaleString("es-ES", { hour12:false }).replace(",", "");
  }
}

// "UTC-05:00" para la fecha dada en la TZ resuelta; nunca lanza
function tzOffsetLabelFor(d){
  try {
    const tz = resolvedTZ();
    const parts = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "shortOffset" })
                    .formatToParts(d);
    const off = parts.find(p => p.type === "timeZoneName")?.value || "UTC";
    return off.replace("GMT", "UTC");
  } catch { return "UTC"; }
}

    // 30 segundos sin datos nuevos => consideramos el hardware "apagado"
    const HW_TIMEOUT_MS = 30000;
    // Último "ping" que hemos visto del hardware (basado en nuevos registros)
    let lastHwRowKey = null;   // identificador de la última fila vista
    let lastHwPingMs = 0;      // Date.now() cuando vimos esa fila por primera vez



    function updateHardwareStatusFromDate(lastDate){
      if (!hwStatusEl) return;

      const now = Date.now();

      // Si recibimos una fecha válida, la usamos solo como "identificador"
      // para saber si apareció una FILA nueva (no nos importa su hora exacta).
      if (lastDate instanceof Date && !isNaN(lastDate.getTime())) {
        const key = lastDate.getTime(); // suficiente como ID del último registro
        if (lastHwRowKey === null) {
          // Primer dato cargado en esta sesión → lo tomamos como "ping" de hardware ahora
          lastHwRowKey = key;
          lastHwPingMs = now;
        } else if (key !== lastHwRowKey) {
          // El último registro cambió → llegó un dato nuevo del ESP32
          lastHwRowKey = key;
          lastHwPingMs = now;
        }
      }

      let cls  = 'hw-status hw-unknown';
      let text = 'Hardware: sin datos';

      if (lastHwPingMs > 0) {
        const ageMs = now - lastHwPingMs;
        if (ageMs <= HW_TIMEOUT_MS) {
          cls  = 'hw-status hw-on';
          text = 'Hardware: prendido';
        } else {
          cls  = 'hw-status hw-off';
          text = 'Hardware: apagado';
        }
      }

      hwStatusEl.className = cls;
      const labelSpan = hwStatusEl.querySelector('.label');
      if (labelSpan) {
        labelSpan.textContent = text;
      } else {
        hwStatusEl.textContent = text;
      }
    }




    /* ====== Utilidades ====== */
// Promedio seguro: ignora no-números y NaN
const avg = (arr) => {
  const nums = (arr || []).filter(Number.isFinite);
  return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
};
    const fmtTS = d => { try { return d.toLocaleString(); } catch { return String(d); } };
// ----- EXTRAER TEXTO DEL MODELO (cubre Chat Completions y Responses API)

// Convierte a número *solo* si hay un valor válido.
// Vacío, guiones, "NA", null/undefined => null (no contará en promedios)
function toNum(v) {
  if (v === null || v === undefined) return null;

  if (typeof v === "number") {
    return Number.isFinite(v) ? v : null;
  }

  if (typeof v === "string") {
    const s = v.trim();
    if (!s || /^[-–—]$/.test(s) || /^na$/i.test(s)) return null; // vacío / guión / NA
    const x = Number(s.replace(",", ".")); // soporta coma decimal
    return Number.isFinite(x) ? x : null;
  }

  return null;
}




function extractAssistantText(anyResp) {
  if (!anyResp) return null;
  let obj = anyResp;
  if (typeof obj === "string") {
    try { obj = JSON.parse(obj); } catch { return null; }
  }
  // Chat Completions (OpenAI style)
  if (obj?.choices?.length) {
    return obj.choices[0]?.message?.content ?? null;
  }
  // Responses API de OpenRouter
  if (obj?.output_text) return obj.output_text;
  if (obj?.output)      return obj.output;
  // Responses API con "raw" (donde vive la completion clásica)
  if (obj?.raw?.choices?.length) {
    return obj.raw.choices[0]?.message?.content ?? null;
  }
  return null;
}

// --- Detecta errores/rate-limit aunque el HTTP sea 200
function isUpstreamErrorOrRateLimited(objOrStr) {
  let s = "";
  try { s = (typeof objOrStr === "string") ? objOrStr : JSON.stringify(objOrStr); } catch {}
  if (!s) return false;
  return (
    /"ok"\s*:\s*false/.test(s) ||
    /"status"\s*:\s*429/.test(s) ||
    /rate[- ]limited/i.test(s) ||
    /Provider returned error/i.test(s) ||
    /code"\s*:\s*429/.test(s)
  );
}



    function parseDateFromCell(v){
      if (v instanceof Date && !isNaN(v)) return v;
      if (typeof v === 'string'){
        const s=v.trim();
        let m=s.match(/^Date\((\d{4}),\s*(\d{1,2}),\s*(\d{1,2})(?:,\s*(\d{1,2}),\s*(\d{2})(?:,\s*(\d{2}))?)?\)$/);
        if(m) return new Date(+m[1],+m[2],+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
        m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
        if(m) return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));
        const d=new Date(s); if(!isNaN(d)) return d;
      }
      if (typeof v === 'number'){
        if (v>1e12) return new Date(v);
        if (v>1e9)  return new Date(v*1000);
        const base = Date.UTC(1899,11,30);
        return new Date(base + v*86400000);
      }
      return null;
    }

    /* ====== Google Sheet (GViz JSONP) ====== */
    window.__sheetConfig = { id: SHEET_ID, name: SHEET_NAME };
    function buildGVizUrlForCallback(limit, cbName){
      const cfg = window.__sheetConfig;
      const base = `https://docs.google.com/spreadsheets/d/${cfg.id}/gviz/tq?`;
      const which = `sheet=${encodeURIComponent(cfg.name)}`;
      const tq = encodeURIComponent(`select A,B,C,D,E,F,G,H order by A desc limit ${Math.max(2000, Math.min(limit, 50000))}`);
      return `${base}${which}&headers=1&tqx=out:json;responseHandler:${cbName}&tq=${tq}&t=${Date.now()}`;
    }
    function fetchRowsJSONP(limit=20000){
      return new Promise((resolve,reject)=>{
        const cb='__gviz_'+Math.random().toString(36).slice(2);
        window[cb]=(resp)=>{ try{
          if(resp.status!=='ok') throw new Error('Respuesta no OK');
          const rows=resp.table.rows.map(r=>r.c.map(c=>c?{v:c.v,f:c.f}:{v:null,f:null}));
          resolve(rows);
        }catch(e){reject(e);}finally{ delete window[cb]; s.remove(); } };
        const s=document.createElement('script');
        s.src=buildGVizUrlForCallback(limit,cb);
        s.onerror=()=>{ delete window[cb]; reject(new Error('JSONP error')); };
        document.body.appendChild(s);
      });
    }

function buildGVizUrlForCallbackDoor(limit, cbName){

function rowsDoorToObjects(rows){
  return rows.map(c => ({
    fechaHora: parseDateFromCell(c[0]?.v) || parseDateFromCell(c[0]?.f),
    puerta:    (c[1]?.v ?? c[1]?.f ?? '').toString()
  })).filter(r => r.fechaHora instanceof Date && !isNaN(r.fechaHora));
}


function rowsToObjects(rows){
  return rows.map(c => {
    const fechaHora = parseDateFromCell(c[0]?.v) || parseDateFromCell(c[0]?.f);
    const hojaTexto = (c[0]?.f && String(c[0].f).trim()) || '';
    const fechaTexto = hojaTexto || (fechaHora ? fechaHora.toLocaleString() : '');

    return {
      fechaHora,               // Date para gráficos/filtros
      fechaTexto,              // ← TEXTO EXACTO como en la hoja (lo verá el modelo)
      balanza1: toNum(c[1]?.v),
      balanza2: toNum(c[2]?.v),
      temp1:    toNum(c[3]?.v),
      temp2:    toNum(c[4]?.v),
      hum1:     toNum(c[5]?.v),
      hum2:     toNum(c[6]?.v),
      puerta:   (c[7]?.v ?? c[7]?.f ?? '').toString()
    };
  }).filter(r => r.fechaHora instanceof Date && !isNaN(r.fechaHora));
}

function isCompleteRow(r){
  // Trata 0 como “missing” (según tu pedido)
  const nums = [r.balanza1, r.balanza2, r.temp1, r.temp2, r.hum1, r.hum2];
  const allNumsOk = nums.every(v => typeof v === "number" && Number.isFinite(v) && v !== 0);

  // Puerta debe venir con texto (Abierto/Cerrado)
  const doorOk = typeof r.puerta === "string" && r.puerta.trim() !== "";

  // Fecha válida ya la garantiza rowsToObjects, lo reafirmamos:
  const dtOk = r.fechaHora instanceof Date && !isNaN(r.fechaHora);

  return dtOk && allNumsOk && doorOk;
}

function normalizeStr(s){
  return (s ?? "")
    .toString()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "") // "cerró" -> "cerro"
    .trim()
    .toLowerCase();
}

// Cuenta EXACTAMENTE "cerro" (tras normalización)
function countDoorClosedOccurrences(rows){
  let count = 0;
  for (const r of rows){
    // normaliza y elimina signos/puntuación para casos tipo "cerro."
    const tok = normalizeStr(r.puerta).replace(/[^a-z]/g,'');
    if (tok === 'cerro') count++;
  }
  return count;
}
function isDoorClosed(val){
  const d = normalizeStr(val);
  if (!d) return false;
  // Cubre "cerró", "cerro", "cerrada", "cerrado", etc. y también "closed"
  return d.includes("cerr") || d.includes("closed");
}

function countDoorClosuresTransition(rows){
  // Cuenta SOLO cuando hay transición a "cerró" (no filas repetidas en cerrado)
  let count = 0;
  let prevClosed = false;

  const sorted = rows
    .filter(r => r.fechaHora instanceof Date && !isNaN(r.fechaHora))
    .sort((a,b) => a.fechaHora - b.fechaHora);

  for (const r of sorted){
    const closed = isDoorClosed(r.puerta);
    if (closed && !prevClosed) count++;
    prevClosed = closed;
  }
  return count;
}

function parseTimeRange(q){
  const now = new Date();
  const H = 3600e3, D = 24*H, W = 7*D, M = 30*D;
  let from=null, to=null, label="completo";

  let m = q.match(/(?:ultima|[uú]ltima|ultimos|[uú]ltimos)\s+(\d{1,2})\s*(horas?|d[ií]as?)/i);
  if (m){ const n=+m[1]; from = new Date(Date.now() - n * ( /hora/i.test(m[2]) ? H : D)); label=`últimas ${n} ${/hora/i.test(m[2])?'horas':'días'}`; return {from,to,label}; }

  if (/ultimas?\s*24\s*h|ultimas?\s*24\s*horas?/i.test(q)) return {from:new Date(Date.now()-24*H),to:null,label:"últimas 24h"};
  if (/\bhoy\b/i.test(q)){ const d=new Date(); d.setHours(0,0,0,0); return {from:d,to:null,label:"hoy"}; }
  if (/\bayer\b/i.test(q)){ const d=new Date(); d.setHours(0,0,0,0); return {from:new Date(d.getTime()-D), to:new Date(d.getTime()), label:"ayer"}; }

  // esta semana
  if (/esta\s+semana/i.test(q)){ const d=new Date(); const wd=(d.getDay()+6)%7; d.setHours(0,0,0,0); return {from:new Date(d.getTime()-wd*D), to:null, label:"esta semana"}; }
  // semana pasada
  if (/semana\s+pasada/i.test(q)){ const today=new Date(); const wd=(today.getDay()+6)%7; const startThisWeek=new Date(today); startThisWeek.setHours(0,0,0,0); startThisWeek.setDate(startThisWeek.getDate()-wd); const startLastWeek=new Date(startThisWeek.getTime()-7*D); const endLastWeek=startThisWeek; return {from:startLastWeek, to:endLastWeek, label:"semana pasada"}; }

  if (/(ultima|[uú]ltima)\s+semana/i.test(q)) return {from:new Date(Date.now()-W), to:null, label:"última semana"};
  if (/este\s+mes/i.test(q)){ const d=new Date(now.getFullYear(), now.getMonth(),1); return {from:d,to:null,label:"este mes"}; }
  if (/(ultimo|[uú]ltimo)\s+mes/i.test(q)) return {from:new Date(Date.now()-M), to:null, label:"último mes"};

  m = q.match(/\b(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\b(?:\s+de)?\s*(\d{4})?/i);
  if (m){ const MONTHS={ "enero":0,"febrero":1,"marzo":2,"abril":3,"mayo":4,"junio":5,"julio":6,"agosto":7,"septiembre":8,"setiembre":8,"octubre":9,"noviembre":10,"diciembre":11 };
    const month = MONTHS[m[1].toLowerCase()], year = m[2]?+m[2]:now.getFullYear(); const start=new Date(year,month,1,0,0,0,0), end=new Date(year,month+1,1,0,0,0,0); return {from:start,to:end,label:`${m[1]} ${year}`.trim()}; }

  m = q.match(/del\s+(\d{1,2})\s+al\s+(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)(?:\s+de\s+(\d{4}))?/i);
  if (m){ const MONTHS={ "enero":0,"febrero":1,"marzo":2,"abril":3,"mayo":4,"junio":5,"julio":6,"agosto":7,"septiembre":8,"setiembre":8,"octubre":9,"noviembre":10,"diciembre":11 };
    const y=m[4]?+m[4]:now.getFullYear(), mo=MONTHS[m[3].toLowerCase()]; const from2=new Date(y,mo,+m[1],0,0,0,0), to2=new Date(y,mo,+m[2]+1,0,0,0,0); return {from:from2,to:to2,label:`del ${m[1]} al ${m[2]} de ${m[3]} ${y}`}; }
  return {from:null,to:null,label};
}

// --- Detecta DOS ventanas de tiempo a partir de la pregunta (mes vs mes)
// Soporta: "septiembre con octubre", "septiembre vs octubre", "comparar septiembre y octubre"
function parseTwoTimeWindows(question){
  const q = (question || "").toLowerCase();

  // 1) Encuentra hasta dos meses nombrados
  const MONTH_RE = /(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)(?:\s+de\s+(\d{4}))?/gi;
  const found = [];
  let m;
  while ((m = MONTH_RE.exec(q)) && found.length < 2) {
    const name = m[1];
    const year = m[2] ? +m[2] : (new Date()).getFullYear();
    const monthIdx = MONTHS[name]; // usa tu mapa existente
    if (typeof monthIdx === "number") {
      const from = new Date(year, monthIdx, 1, 0, 0, 0, 0);
      const to   = new Date(year, monthIdx + 1, 1, 0, 0, 0, 0);
      found.push({ from, to, label: `${name} ${year}` });
    }
  }

  // 2) Sólo consideramos "modo comparación" si hay una señal de comparar
  const wantsCompare = /(compara|comparar|comparación|vs|frente\s*a|contra)/i.test(q);

  if (wantsCompare && found.length === 2) {
    return { left: found[0], right: found[1] };
  }
  return null;
}

function computeStatsForSlice(slice){
  const cols = ['balanza1','balanza2','temp1','temp2','hum1','hum2'];
  const stats = {};

  for (const c of cols){
    const v = slice.map(r => r[c]).filter(Number.isFinite);
    if (!v.length) continue;

    const average = avg(v);
    stats[c] = {
      min:   Math.min(...v),
      max:   Math.max(...v),
      avg:   average !== null ? Number(average.toFixed(2)) : null,
      first: v[v.length - 1], // más antiguo en el slice
      last:  v[0]             // más reciente en el slice
    };
  }

  // eventos de puerta
  const evs   = doorEvents(slice);
  const opens = evs.filter(e => e.state === 'Abierto').length;

  return {
    stats,
    rows: slice.length,
    door: {
      openCount: opens,
      lastChange: evs[evs.length-1] || null
    }
  };
}

// --- Construye un DATA CONTEXT para comparación de dos ventanas
function buildComparisonContext(leftWin, rightWin){
  const data = window.__latestData || [];

  // Slices de cada ventana de tiempo (p. ej. septiembre y octubre)
  const leftSlice  = filterByRange(data,  leftWin.from,  leftWin.to);
  const rightSlice = filterByRange(data, rightWin.from, rightWin.to);

  // Estadísticos por columna (min, max, avg, etc.)
  const leftStats  = computeStatsForSlice(leftSlice);
  const rightStats = computeStatsForSlice(rightSlice);

  // Ventas y reposiciones por producto en cada ventana
  const leftSales  = computeSalesForSlice(leftSlice);
  const rightSales = computeSalesForSlice(rightSlice);

  // Diferencias de promedios entre ventanas (para ayudar al modelo)
  const delta = {};
  for (const k of Object.keys(leftStats.stats || {})){
    if (rightStats.stats && rightStats.stats[k]) {
      const a = leftStats.stats[k].avg;
      const b = rightStats.stats[k].avg;
      if (Number.isFinite(a) && Number.isFinite(b)) {
        delta[k] = {
          avg_diff: Number((b - a).toFixed(2)),
          avg_pct:  a ? Number(((b - a) / a * 100).toFixed(1)) : null
        };
      }
    }
  }

  return {
    mode: 'compare',

    // Cada lado trae sus stats, puerta y ahora también ventas
    left:  { label: leftWin.label,  ...leftStats,  sales: leftSales  },
    right: { label: rightWin.label, ...rightStats, sales: rightSales },

    // Resumen de ventas para comparación directa (opcional pero útil)
    sales: {
      left:  leftSales,
      right: rightSales
    },

    delta
  };
}

// --- Versión "lista para usar" del contexto: detecta si hay que comparar o no
function buildSmartDataContext(question){
  const cmp = parseTwoTimeWindows(question);
  if (cmp) return buildComparisonContext(cmp.left, cmp.right);
  // si no hay comparación, reutiliza tu contexto original "simple"
  return buildDataContext(question);
}




    function filterByRange(data, from, to){
      return data.filter(r=>{
        const t = r.fechaHora?.getTime?.();
        if (!t) return false;
        if (from && t < from.getTime()) return false;
        if (to && t >= to.getTime()) return false;
        return true;
      });
    }

function doorEvents(list){
  const asc = [...(list || [])].reverse();  // más viejo → más nuevo
  const events = [];
  let prev = null;

  for (const r of asc){
    const isOpen = typeof r.puerta === 'string'
      ? r.puerta.toLowerCase().includes('abier')
      : false;
    if (prev === null){ prev = isOpen; continue; }
    if (isOpen !== prev){
      events.push({
        at: r.fechaHora,         // Date para cálculos
        atText: r.fechaTexto,    // ← TEXTO EXACTO de la hoja
        state: isOpen ? 'Abierto' : 'Cerrado'
      });
      prev = isOpen;
    }
  }
  return events;
}

// Calcula ventas y reposiciones por producto a partir de una lista de filas
// slice: array de objetos { fechaHora, balanza1, balanza2, ... }
function computeSalesForSlice(slice){
  const asc = [...(slice || [])].sort((a,b) => a.fechaHora - b.fechaHora);

  // Umbral para ignorar ruido de sensor (en gramos)
  const THRESHOLD = 10;

  const res = {
    balanza1: { sold_g: 0, restocked_g: 0, restocks: 0 },
    balanza2: { sold_g: 0, restocked_g: 0, restocks: 0 }
  };

  for (let i = 1; i < asc.length; i++){
    const prev = asc[i-1];
    const curr = asc[i];

    // --- Producto 1 ---
    if (Number.isFinite(prev.balanza1) && Number.isFinite(curr.balanza1)){
      const d1 = curr.balanza1 - prev.balanza1; // >0 reposición, <0 venta
      if (d1 < -THRESHOLD){
        res.balanza1.sold_g += -d1;    // suma gramos vendidos
      } else if (d1 > THRESHOLD){
        res.balanza1.restocked_g += d1;
        res.balanza1.restocks += 1;
      }
    }

    // --- Producto 2 ---
    if (Number.isFinite(prev.balanza2) && Number.isFinite(curr.balanza2)){
      const d2 = curr.balanza2 - prev.balanza2;
      if (d2 < -THRESHOLD){
        res.balanza2.sold_g += -d2;
      } else if (d2 > THRESHOLD){
        res.balanza2.restocked_g += d2;
        res.balanza2.restocks += 1;
      }
    }
  }

  // Redondeo bonito
  for (const key of ["balanza1","balanza2"]){
    res[key].sold_g       = Number(res[key].sold_g.toFixed(2));
    res[key].restocked_g  = Number(res[key].restocked_g.toFixed(2));
  }

  return res;
}




function localAnswer(question){
  const data = window.__latestData || [];
  if (!data.length) return null;

  const q = (question || "").toLowerCase();
  const field = parseField(q);
  const agg   = parseAgg(q);
  const {from, to, label} = parseTimeRange(q);
  const slice = filterByRange(data, from, to);

  if (!agg) return null;

  // ---- Preguntas de puerta ----
  if (agg.fn === "door_last_change"){
    const evs  = doorEvents(slice);
    const last = evs[evs.length-1];
    if (!last) {
      return {ok:true, text:`No hay cambios de puerta detectados en ${label}.`};
    }
    const when = last.at instanceof Date ? last.at.toLocaleString() : String(last.at);
    return {ok:true, text:`Último cambio de puerta en ${label}: ${when} → ${last.state}.`};
  }

  if (agg.fn === "door_open_count"){
    const opens = doorEvents(slice).filter(e=>e.state==='Abierto').length;
    return {
      ok:true,
      text:`La puerta se abrió ${opens} ${opens===1?'vez':'veces'} en ${label}.`
    };
  }

  // Si no es puerta, necesitamos un campo numérico válido
  if (!field || field.key === "puerta") return null;

  const vals = slice.map(r => r[field.key]).filter(Number.isFinite);
  if (!vals.length) {
    return {ok:true, text:`No hay datos numéricos de ${field.label} para ${label}.`};
  }

  let value, extra = "";
  switch(agg.fn){
    case "avg":   value = Number(avg(vals).toFixed(2)); break;
    case "max":   value = Math.max(...vals); break;
    case "min":   value = Math.min(...vals); break;
    case "sum":   value = Number(vals.reduce((a,b)=>a+b,0).toFixed(2)); break;
    case "count": value = vals.length; break;
    case "trend": {
      const first = vals[vals.length-1];
      const last  = vals[0];
      const diff  = Number((last - first).toFixed(2));
      value = diff;
      extra = diff>0 ? "tendencia al alza"
                     : diff<0 ? "tendencia a la baja"
                              : "sin cambio neto";
      break;
    }
    default:
      return null;
  }

  // Unidades según el tipo de campo
  let unit = "";
  if (/temp/i.test(field.key))      unit = "°C";
  else if (/hum/i.test(field.key)) unit = "%";
  else if (/balanza/i.test(field.key)) unit = "g";

  const pretty = unit ? `${value} ${unit}` : String(value);
  let msg = `${agg.label} de ${field.label} en ${label}: ${pretty}.`;
  if (agg.fn === "trend") {
    msg += ` (${extra})`;
  }

  const latest = slice[0];
  if (latest && typeof latest[field.key] === 'number') {
    msg += ` Último valor: ${latest[field.key]}${unit ? ' '+unit : ''} (${fmtTS(latest.fechaHora)}).`;
  }

  return {ok:true, text: msg};
}

    descripcion: "Humedad relativa en la zona superior o parte alta del refrigerador (cerca del sensor 2). Es una medida ambiental, no ligada a un único producto."
  }
};

  // Eventos de puerta
  
  const events = doorEvents(slice);
  const openCount  = events.filter(e => e.state === 'Abierto').length;
  const lastOpen   = [...events].reverse().find(e => e.state === 'Abierto') || null;
  const lastChange = events[events.length-1] || null;


  // Primer y último registro del rango (TEXTO de la hoja)
  const firstRow = slice[slice.length-1] || null;
  const lastRow  = slice[0] || null;

  // Muestra (capada) con texto de la hoja
  const sample = slice.slice(0, 200).map(r => ({
    sheet_t: r.fechaTexto,  // texto tal como está en la hoja
    b1: r.balanza1, b2: r.balanza2,
    t1: r.temp1, t2: r.temp2,
    h1: r.hum1, h2: r.hum2,
    p: r.puerta
  }));

  return {
    window: label,
    columns: columnMeta,
    range: {
      sheet_from: firstRow ? firstRow.fechaTexto : null,
      sheet_to:   lastRow  ? lastRow.fechaTexto  : null,
      rows: slice.length
    },
    latest: lastRow ? {
      sheet_at: lastRow.fechaTexto,
      balanza1: lastRow.balanza1, balanza2: lastRow.balanza2,
      temp1: lastRow.temp1, temp2: lastRow.temp2,
      hum1: lastRow.hum1,  hum2: lastRow.hum2,
      puerta: lastRow.puerta
    } : null,
    stats: colStats,
    sales,   // 👈 NUEVO: ventas y reposiciones por producto
    door: {
      openCount,
      lastOpen:   lastOpen   ? { sheet_at: lastOpen.atText,   state: lastOpen.state }   : null,
      lastChange: lastChange ? { sheet_at: lastChange.atText, state: lastChange.state } : null
    },
    sample
  };

}



/* ====== Llamada al proxy (con fallback) ====== */
async function orChat(userText){
  setChatStatus('Enviando…');

  // 0) Si algún día quieres reactivar modo mixto, aquí irían las respuestas locales
  // if (!RELY_ON_MODEL) {
  //   const local = localAnswer(userText) || localSummary(userText);
  //   if (local?.ok) { setChatStatus('Respuesta local'); return local.text; }
  // }

  // 1) Construir el contexto de datos para que el MODELO haga los cálculos
  const useCtx = !!useDataCtx.checked;
  const ctx    = useCtx ? buildSmartDataContext(userText) : null;

  const messages = [
    {
      role: "system",
      content: `
Eres un analista de datos de una heladería comercial. En la hoja de cálculo hay lecturas de un refrigerador con:
- Inventario en gramos de dos productos: la columna "balanza1" corresponde al Bote de helado 1 (producto 1) y la columna "balanza2" al Bote de helado 2 (producto 2).
- Temperaturas "temp1" y "temp2" (°C) y humedades "hum1" y "hum2" (%), que son mediciones AMBIENTALES:
   • "temp1" y "hum1" corresponden a un sensor ubicado en la zona inferior o fondo del refrigerador.
   • "temp2" y "hum2" corresponden a un sensor ubicado en la zona superior o parte alta del refrigerador.
  Estas temperaturas y humedades NO están asociadas directamente a un producto en particular, sino al ambiente interno del refrigerador que afecta a todos los productos.
- Estado de la puerta del refrigerador ("puerta": Abierto/Cerrado).

El front-end ya interpretó la pregunta y te envía un JSON llamado "DATA CONTEXT" con:
- "window" y "range": resumen del rango de fechas que debes considerar. 
  Si el usuario NO pidió un rango específico, "range" cubre TODA la historia disponible.
- "latest": último registro de ese rango (estado más reciente).
- "oldest": primer registro del rango (estado más antiguo).
- "stats": mínimos, máximos, promedios y valores inicial/final por columna en ese rango.
- "door": eventos de puerta (veces que se abrió, último cambio, etc.).
- "sales": ventas y reposiciones aproximadas por producto dentro del rango:
   • "sales.balanza1.sold_g" y "sales.balanza2.sold_g" son la suma de todas las caídas de peso significativas (gramos vendidos).
   • "restocked_g" y "restocks" indican reposiciones de inventario (subidas de peso).
- "columns": descripciones de cada columna (tipo de dato, unidades, significado).
- "sample": una muestra de filas reales de la hoja para que veas ejemplos concretos.

Interpretación de ventas:
- El valor de "balanza1" y "balanza2" representa el stock en gramos dentro del refrigerador.
- Cuando el peso BAJA entre dos lecturas, se interpreta como VENTA (salida de producto).
- Cuando el peso SUBE entre dos lecturas, se interpreta como REPOSICIÓN de inventario (se colocó un bote nuevo o se rellenó).

Instrucciones IMPORTANTES:
1) Si preguntan por el dato más antiguo o desde cuándo hay registros, responde usando "oldest" y/o "range.sheet_from".
2) Si preguntan por el dato más reciente, el estado actual o el último valor, usa "latest" y/o "range.sheet_to".
3) Si preguntan por ventas, consumo, "qué helado se vendió más", "qué producto salió más", etc.:
   - Usa SIEMPRE los campos de "sales" (por ejemplo "sales.balanza1.sold_g" y "sales.balanza2.sold_g") para comparar gramos vendidos.
   - NO confundas stock promedio con ventas: un peso promedio más alto NO significa que se vendió más, sino que había más producto almacenado.
   - Si no hay datos suficientes para estimar ventas en el rango, indícalo claramente.
4) Para promedios, máximos, mínimos, tendencias o comparaciones de niveles (stock, temperatura, humedad), usa SIEMPRE los números de "stats" y/o de "sample". No inventes valores ni fechas.
5) Cuando analices temperaturas y humedades, recuerda que son ambientales:
   - No digas "temperatura del producto 1" o "humedad del producto 2".
   - Describe siempre "sensor inferior (temp1/hum1)" y "sensor superior (temp2/hum2)" o "parte baja" vs "parte alta del refrigerador".
6) Usa EXCLUSIVAMENTE los campos "sheet_*" y "sample[].sheet_t" para mencionar fechas/horas (son texto tal como figuran en la hoja). No cites campos ISO internos como "at", "from" o "to".
7) Si el usuario pide análisis de un periodo donde no hay datos, explica claramente que no hay registros disponibles en ese intervalo.
8) Responde SIEMPRE en español, en formato de 3–8 viñetas claras, sin devolver JSON ni código.
`
  },
    { role: "user", content: userText }
  ];

  if (ctx) {
    messages.push({
      role: "user",
      content: "DATA CONTEXT (JSON):\n" + JSON.stringify(ctx)
    });
  }

  const payload = {
    model: OR_MODEL_ID,    // deepseek/deepseek-chat-v3-0324
    messages,
    temperature: 0.3,
    max_tokens: 3000,      // margen amplio para respuestas más completas
    max_output_tokens: 3000
  };

  let res, raw, data;
  try {
    res = await fetch(OR_PROXY_URL, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload)
    });
    raw = await res.text();
    try { data = JSON.parse(raw); } catch { /* puede venir en texto plano */ }
  } catch (e) {
    throw new Error("No se pudo contactar al proveedor. Reintenta en unos segundos.");
  }

  // 2) ¿el upstream devolvió cuerpo con error/rate-limit aunque HTTP sea 200?
  const upstreamError = (!res.ok) || isUpstreamErrorOrRateLimited(data || raw);

  // 3) Extraer texto del modelo (cubre Chat Completions y Responses API)
  let text = !upstreamError
    ? (extractAssistantText(data) ?? extractAssistantText(raw))
    : null;

  // 4) Fallback automático: reintentar con openrouter/auto
  if (upstreamError || !text) {
    const r2 = await fetch(OR_PROXY_URL, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        model: "openrouter/auto",
        messages,
        max_tokens: 1200,
        max_output_tokens: 1200,
        temperature: 0.3
      })
    });
    const raw2 = await r2.text(); let d2 = null;
    try { d2 = JSON.parse(raw2); } catch {}
    text = extractAssistantText(d2) ?? extractAssistantText(raw2);

    if (!r2.ok || !text) {
      throw new Error("El proveedor está temporalmente saturado. Intenta de nuevo en breve.");
    }
  }

  setChatStatus('Listo');
  return (text || '').trim() || '(sin texto)';
}
